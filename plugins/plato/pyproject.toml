[project]
name = "openacademy-plato"
version = "0.1.0"
description = "Plato: the openacademy teaching protocol as an MCP server over the openacademy API."
requires-python = ">=3.11"
dependencies = ["mcp>=2", "httpx>=0.27"]

[project.scripts]
openacademy-plato = "plato.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plato"]

[tool.hatch.build.targets.wheel.force-include]
"skills/plato/SKILL.md" = "plato/SKILL.md"
